build-type: config-file
content: |
  MEMORY {
    RAM : ORIGIN = ${RISCV_RAM_REGION_BEGIN}, LENGTH = ${RISCV_RAM_REGION_SIZE}
    /*
     * MAGIA L2 window for the buffers shared with zero copy by the OpenMP
     * device MAGIADEV_SHMMEM (libopenmptargetmagia). Same values as
     * OFL_SHM_BASE / OFL_SHM_END in libmagiaapi/offload_layout.h: outside
     * the offload region with the mailbox and the shared heap, below the MAGIA code (0xCC00_0000).
     */
    L2_OMP_SHM : ORIGIN = 0xC1000000, LENGTH = 0x0B000000
  }

  REGION_ALIAS ("REGION_START", RAM);
  REGION_ALIAS ("REGION_START_LOAD", RAM);
  REGION_ALIAS ("REGION_TEXT", RAM);
  REGION_ALIAS ("REGION_TEXT_LOAD", RAM);
  REGION_ALIAS ("REGION_FAST_TEXT", RAM);
  REGION_ALIAS ("REGION_FAST_TEXT_LOAD", RAM);
  REGION_ALIAS ("REGION_RODATA", RAM);
  REGION_ALIAS ("REGION_RODATA_LOAD", RAM);
  REGION_ALIAS ("REGION_DATA", RAM);
  REGION_ALIAS ("REGION_DATA_LOAD", RAM);
  REGION_ALIAS ("REGION_FAST_DATA", RAM);
  REGION_ALIAS ("REGION_FAST_DATA_LOAD", RAM);
  REGION_ALIAS ("REGION_BSS", RAM);
  REGION_ALIAS ("REGION_RTEMSSTACK", RAM);
  REGION_ALIAS ("REGION_WORK", RAM);

  /*
   * Before INCLUDE linkcmds.base: input sections go to the first matching
   * rule, and linkcmds.base ends with .unexpected_sections { *(*) }, a
   * zero-length region that makes the link fail for unknown sections.
   *
   * NOLOAD: the RTEMS ELF carries no data for this section (initializers are
   * ignored and the content is undefined at boot, also left over from a
   * previous run): the application initializes the buffers in code.
   * Variables are placed here with MAGIA_OMP_SHARED (magia_api.h).
   */
  SECTIONS {
    .omp_offloaded_buffer_L2 (NOLOAD) : ALIGN(8) {
      __omp_offloaded_buffer_L2_begin = .;
      *(.omp_offloaded_buffer_L2 .omp_offloaded_buffer_L2.*)
      . = ALIGN(8);
      __omp_offloaded_buffer_L2_end = .;
    } > L2_OMP_SHM
  }

  INCLUDE linkcmds.base
